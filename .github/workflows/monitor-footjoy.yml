name: Monitor FootJoy Events

on:
  schedule:
    # Every day at 9am UK time (8am UTC during BST, adjust to 9am UTC in winter)
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run monitor script
        id: monitor
        run: node scripts/monitor-footjoy.mjs

      - name: Commit updated state
        if: steps.monitor.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .monitor/footjoy-events.json
          git commit -m "chore: update FootJoy event snapshot" || echo "No commit needed"
          git push

      - name: Create GitHub issue for new events
        if: steps.monitor.outputs.changed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const count = `${{ toJSON(steps.monitor.outputs.new_count) }}`;
            const events = `${{ toJSON(steps.monitor.outputs.new_events) }}`;

            const title = `FootJoy monitor: ${count} new event(s) - ${new Date().toISOString().slice(0, 16)} UTC`;
            const body = [
              'New FootJoy shoe fitting events were added.',
              '',
              `Detected by workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              `New events count: ${count}`,
              '',
              '### New events',
              '```text',
              events,
              '```'
            ].join('\n');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body
            });