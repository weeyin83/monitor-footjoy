name: Monitor FootJoy Events

on:
  schedule:
    # Every day at 9am UK time (8am UTC during BST, adjust to 9am UTC in winter)
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run monitor script
        id: monitor
        run: node scripts/monitor-footjoy.mjs

      - name: Commit updated state
        if: steps.monitor.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .monitor/footjoy-events.json
          git commit -m "chore: update FootJoy event snapshot" || echo "No commit needed"
          git push

      - name: Create GitHub issue for new events
        if: steps.monitor.outputs.changed == 'true'
        uses: actions/github-script@v7
        env:
          NEW_COUNT: ${{ steps.monitor.outputs.new_count }}
          NEW_EVENTS: ${{ steps.monitor.outputs.new_events }}
          HAS_SCOTLAND: ${{ steps.monitor.outputs.has_scotland }}
          SCOTLAND_COUNT: ${{ steps.monitor.outputs.scotland_count }}
          SCOTLAND_EVENTS: ${{ steps.monitor.outputs.scotland_events }}
        with:
          script: |
            const count = process.env.NEW_COUNT;
            const events = process.env.NEW_EVENTS;
            const hasScotland = process.env.HAS_SCOTLAND === 'true';
            const scotlandCount = process.env.SCOTLAND_COUNT;
            const scotlandEvents = process.env.SCOTLAND_EVENTS;

            const flag = hasScotland ? '\uD83C\uDFF4\uDB40\uDC67\uDB40\uDC62\uDB40\uDC73\uDB40\uDC63\uDB40\uDC74\uDB40\uDC7F ' : '';
            const scotlandSuffix = hasScotland ? ` (${scotlandCount} Scottish)` : '';
            const title = `${flag}FootJoy monitor: ${count} new event(s)${scotlandSuffix} - ${new Date().toISOString().slice(0, 16)} UTC`;

            const bodyParts = [
              'New FootJoy shoe fitting events were added.',
              '',
              `Detected by workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              `New events count: ${count}`
            ];

            if (hasScotland) {
              bodyParts.push(
                '',
                `### \uD83C\uDFF4\uDB40\uDC67\uDB40\uDC62\uDB40\uDC73\uDB40\uDC63\uDB40\uDC74\uDB40\uDC7F New Scottish events (${scotlandCount})`,
                '```text',
                scotlandEvents,
                '```'
              );
            }

            bodyParts.push(
              '',
              '### All new events',
              '```text',
              events,
              '```'
            );

            const labels = ['footjoy-event'];
            if (hasScotland) labels.push('footjoy-event-scotland');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body: bodyParts.join('\n'),
              labels,
              assignees: [context.repo.owner]
            });